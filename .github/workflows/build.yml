
name: Build C++ to EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile C++
        run: g++ menu_makanan.cpp -o menu_makanan.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: menu-makanan
          path: menu_makanan.exe
