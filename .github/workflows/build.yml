
name: Compile C++ to EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MinGW
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: mingw-w64-x86_64-gcc

    - name: Compile C++
      shell: msys2 {0}
      run: g++ main.cpp -o main.exe -static -static-libgcc -static-libstdc++

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: hasil-exe
        path: main.exe
